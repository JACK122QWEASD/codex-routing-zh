# 复制为 ~/.codex/config.toml
# 下面是示例值（强档 ChatGPT / 弱档 GLM），第一次用可以直接照抄跑通，之后再换成你自己的。
# 密钥不要提交进版本库。

model = "chatgpt"
model_provider = "openai"

# ── 强档：必须支持 Responses 协议（Codex 只认它）──
[model_providers.openai]
name = "ChatGPT (强)"
base_url = "https://api.openai.com/v1"
env_key = "OPENAI_API_KEY"

# ── 弱档：走 agent.md 的 run_weak() 直连 HTTP，不经过 Codex ──
# 只需 Chat Completions
[model_providers.glm]
name = "GLM (弱)"
base_url = "https://open.bigmodel.cn/api/paas/v4"
env_key = "GLM_API_KEY"
