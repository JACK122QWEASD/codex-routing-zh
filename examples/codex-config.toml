# 复制为 ~/.codex/config.toml，填入你自己的端点与密钥
# 注意：密钥不要提交进版本库

model = "deepseek-v4-pro"
model_provider = "deepseek"

# ── 强档：必须支持 Responses 协议（Codex 只认它）──
[model_providers.deepseek]
name = "DeepSeek (强)"
base_url = "https://api.deepseek.com/v1"
env_key = "DEEPSEEK_API_KEY"

# ── 弱档：走 agent.md 的 run_weak() 直连 HTTP，不经过 Codex ──
# 只需 Chat Completions，所以火山方舟 / 智谱 / 百炼都能接
[model_providers.volcengine]
name = "Volcengine Ark - GLM (弱)"
base_url = "https://ark.cn-beijing.volces.com/api/v3"
env_key = "ARK_API_KEY"
