# 复制为 ~/.codex/config.toml，填入你自己的端点与密钥
# 注意：密钥不要提交进版本库

model = "<你的强模型名>"
model_provider = "your-strong"

# ── 强档：必须支持 Responses 协议（Codex 只认它）──
[model_providers.your-strong]
name = "强模型"
base_url = "<你的强模型端点>/v1"
env_key = "STRONG_API_KEY"

# ── 弱档：走 agent.md 的 run_weak() 直连 HTTP，不经过 Codex ──
# 只需 Chat Completions，所以任何厂商都能接
[model_providers.your-cheap]
name = "弱模型"
base_url = "<你的弱模型端点>/v1"
env_key = "CHEAP_API_KEY"
